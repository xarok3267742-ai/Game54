name: Build signed AAB

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag to create or update when create_github_release is true.
        required: true
        default: v1.0.0-rc1
      create_github_release:
        description: Attach the signed AAB to a GitHub Release.
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  signed-aab:
    name: Build and verify signed Android App Bundle
    runs-on: ubuntu-latest
    env:
      PORYADOK5_KEYSTORE_PASSWORD: ${{ secrets.PORYADOK5_KEYSTORE_PASSWORD }}
      PORYADOK5_KEY_ALIAS: ${{ secrets.PORYADOK5_KEY_ALIAS }}
      PORYADOK5_KEY_PASSWORD: ${{ secrets.PORYADOK5_KEY_PASSWORD }}
      PORYADOK5_SUPPORT_EMAIL: ${{ secrets.PORYADOK5_SUPPORT_EMAIL }}
      PORYADOK5_PRIVACY_POLICY_URL: ${{ secrets.PORYADOK5_PRIVACY_POLICY_URL }}
      PORYADOK5_FEATURE_GRAPHIC_APPROVED: ${{ secrets.PORYADOK5_FEATURE_GRAPHIC_APPROVED }}
      PORYADOK5_DATA_SAFETY_CONFIRMED: ${{ secrets.PORYADOK5_DATA_SAFETY_CONFIRMED }}
      PORYADOK5_TARGET_AUDIENCE_CONFIRMED: ${{ secrets.PORYADOK5_TARGET_AUDIENCE_CONFIRMED }}
      PORYADOK5_CONTENT_RATING_CONFIRMED: ${{ secrets.PORYADOK5_CONTENT_RATING_CONFIRMED }}
      PORYADOK5_INTERNAL_TESTING_CONFIRMED: ${{ secrets.PORYADOK5_INTERNAL_TESTING_CONFIRMED }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode upload keystore
        env:
          PORYADOK5_KEYSTORE_BASE64: ${{ secrets.PORYADOK5_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${PORYADOK5_KEYSTORE_BASE64:-}" ]]; then
            echo "PORYADOK5_KEYSTORE_BASE64 secret is required." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/poryadok5"
          printf '%s' "$PORYADOK5_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/poryadok5/upload.jks"
          echo "PORYADOK5_KEYSTORE_PATH=$RUNNER_TEMP/poryadok5/upload.jks" >> "$GITHUB_ENV"

      - name: Validate release signing inputs
        run: scripts/check_release_signing_inputs.py --require

      - name: Build signed release AAB
        run: ./gradlew :app:printReleaseSigningStatus bundleRelease --console=plain

      - name: Verify AAB signature
        run: jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab

      - name: Build Play submission packet
        run: |
          set -euo pipefail
          scripts/build_play_submission_packet.sh
          scripts/check_release_artifact_manifest.py
          scripts/check_play_submission_packet_contents.py
          scripts/check_play_submission_packet_sync.py

      - name: Generate AAB checksum
        run: shasum -a 256 app/build/outputs/bundle/release/app-release.aab > app-release.aab.sha256

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: poryadok5-signed-aab
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app-release.aab.sha256
          if-no-files-found: error

      - name: Upload Play submission packet
        uses: actions/upload-artifact@v4
        with:
          name: poryadok5-play-submission
          path: play-submission
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: ${{ inputs.create_github_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              app/build/outputs/bundle/release/app-release.aab \
              app-release.aab.sha256 \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              app/build/outputs/bundle/release/app-release.aab \
              app-release.aab.sha256 \
              --title "Порядок 5 ${RELEASE_TAG}" \
              --notes "Signed Android App Bundle built by GitHub Actions. Verify checksum before upload to Play Console."
          fi
